<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Basketball Scoreboard</title>
</head>
<body>
    <div class="container">
        <h2>HOME</h2>
        <div id="home-el" class="score">0</div>
        <div class="buttons">
            <button onclick="add1home()">+1</button>
            <button onclick="add2home()">+2</button>
            <button onclick="add3home()">+3</button>
        </div>
    </div>
    <div class="function-buttons">
        <button onclick="reset()">NEW GAME</button>
    </div>
    <div class="container">
        <h2>GUEST</h2>
        <div id="guest-el" class="score">0</div>
        <div class="buttons">
            <button onclick="add1guest()">+1</button>
            <button onclick="add2guest()">+2</button>
            <button onclick="add3guest()">+3</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
